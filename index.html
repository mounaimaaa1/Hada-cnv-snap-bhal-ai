<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>InstaTools Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --insta-pink: #E1306C;
            --bg-chat: #09090b;
            --bg-workspace: #020202;
            --bg-bubble-user: #1c1c1e;
            --border-color: #27272a;
            --text-main: #fafafa;
            --text-muted: #71717a;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --chat-btn-bg: #0c0c0e;
            --chat-btn-border: #1e1e22;
            --menu-bg: rgba(9, 9, 11, 0.95);
            --alert-bg: rgba(20, 20, 25, 0.85);
            --alert-border: rgba(255, 68, 68, 0.4);
        }

        [data-theme="light"] {
            --bg-chat: #f4f4f5;
            --bg-workspace: #e4e4e7;
            --bg-bubble-user: #e4e4e7;
            --border-color: #d4d4d8;
            --text-main: #09090b;
            --text-muted: #71717a;
            --chat-btn-bg: #ffffff;
            --chat-btn-border: #e4e4e7;
            --menu-bg: rgba(244, 244, 245, 0.95);
            --alert-bg: rgba(255, 255, 255, 0.9);
            --alert-border: rgba(255, 68, 68, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-workspace);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-chat);
            display: flex;
            flex-direction: column;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-chat);
            z-index: 99;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            padding-top: calc(16px + env(safe-area-inset-top));
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-bars-btn { background: transparent; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; }
        .ai-brand { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; display: flex; align-items: center; }
        .ai-brand .part-insta { background: var(--insta-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ai-brand .part-tools { color: var(--text-main); }

        .header-actions { display: flex; align-items: center; gap: 12px; }
        .theme-btn { background: var(--chat-btn-bg); border: 1px solid var(--border-color); color: var(--text-main); font-size: 16px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; }

        .target-profile-bar {
            display: none;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: var(--chat-btn-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 98;
        }
        .target-profile-avatar { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: #252525; border: 2px solid var(--insta-pink); display: grid; place-items: center; flex: none; }
        .target-profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .target-profile-info .username { font-weight: 800; font-size: 15px; margin-bottom: 3px; color: var(--text-main); }
        .target-profile-info .status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .target-profile-info .status-dot { width: 7px; height: 7px; background: #20e05f; border-radius: 50%; box-shadow: 0 0 6px #20e05f; }

        .insta-dropdown-menu {
            position: absolute;
            top: calc(68px + env(safe-area-inset-top));
            left: 16px;
            width: 220px;
            background: var(--menu-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }
        .menu-item { padding: 14px 16px; color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .menu-item i { color: var(--insta-pink); }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 5;
        }

        .chat-row { display: flex; gap: 14px; max-width: 100%; }
        .chat-row.user-row { flex-direction: row-reverse; }

        .bot-avatar {
            width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; background: var(--insta-gradient); color: #fff; font-size: 18px;
        }

        .msg-bubble { font-size: 15px; line-height: 1.5; max-width: 85%; color: var(--text-main); padding-top: 6px; }
        .user-row .msg-bubble { background: var(--bg-bubble-user); padding: 12px 18px; border-radius: 18px; max-width: 75%; font-weight: 500; }

        .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 8px 0; }
        .typing-dots span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounceDot 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .options-box { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; width: 100%; }
        .chat-opt-btn {
            background: var(--chat-btn-bg); border: 1px solid var(--chat-btn-border); color: var(--text-main);
            padding: 18px 16px; border-radius: 18px; text-align: left; font-size: 15px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; justify-content: space-between; width: 100%;
        }
        .btn-left-content { display: flex; align-items: center; gap: 16px; }
        .chat-opt-btn i.btn-icon { font-size: 16px; width: 20px; text-align: center; color: var(--insta-pink); }

        .results-box {
            background: var(--chat-btn-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-top: 14px;
        }
        .results-box h5 { color: var(--insta-pink); margin-bottom: 8px; font-size: 14px; }
        .results-list { list-style: none; font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
        .results-list li { color: var(--text-main); background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 8px; }

        .chat-input-area { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)) 16px; background: var(--bg-chat); z-index: 10; }
        .input-box-container {
            background: var(--chat-btn-bg); border: 1px solid var(--border-color); border-radius: 30px;
            display: flex; align-items: center; padding: 6px 8px 6px 20px;
        }
        .gpt-input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 15px; flex-grow: 1; padding: 10px 0; }
        .gpt-input::placeholder { color: var(--text-muted); }
        .send-btn {
            width: 40px; height: 40px; background: var(--text-main); color: var(--bg-chat); border: none;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
        }
        .footer-banner { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 14px; }
        .hidden-row { display: none !important; }

        .custom-alert {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120px);
            background: var(--alert-bg); color: #ff4444; border: 1px solid var(--alert-border);
            padding: 14px 22px; border-radius: 20px; font-weight: 600; font-size: 14px; z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s; opacity: 0; display: flex; align-items: center; gap: 12px;
        }
        .custom-alert.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body data-theme="dark">

    <div class="custom-alert" id="errorAlert">
        <i class="fa-solid fa-circle-exclamation"></i> <span id="alertText">Please enter target Instagram username first!</span>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <button class="menu-bars-btn" onclick="toggleInstaMenu(event)"><i class="fa-solid fa-bars"></i></button>
                <div class="ai-brand"><span class="part-insta">Insta</span><span class="part-tools">Tools</span></div>
            </div>
            <div class="header-actions">
                <button class="theme-btn" id="themeToggleBtn" onclick="toggleThemeNode()"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>

        <div class="target-profile-bar" id="targetProfileBar">
            <div class="target-profile-avatar"><img id="barAvatarImg" src="" alt="Avatar"></div>
            <div class="target-profile-info">
                <div class="username" id="barUsernameTxt">@username</div>
                <div class="status"><span class="status-dot"></span> Profile Linked & Tracked</div>
            </div>
        </div>

        <div class="insta-dropdown-menu" id="instaMenu">
            <a href="#" class="menu-item"><i class="fa-solid fa-user-shield"></i> Privacy Policy</a>
            <a href="#" class="menu-item"><i class="fa-solid fa-circle-question"></i> Support</a>
        </div>

        <div class="chat-history" id="chatWindow">
            <div class="chat-row ai-row" id="welcomeMsg">
                <div class="bot-avatar"><i class="fa-brands fa-instagram"></i></div>
                <div class="msg-bubble" id="welcomeText"></div>
            </div>
            <div class="chat-row ai-row hidden-row" id="typingBubble">
                <div class="bot-avatar"><i class="fa-brands fa-instagram"></i></div>
                <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-box-container">
                <input type="text" class="gpt-input" id="userInputField" placeholder="Enter target Instagram username..." autocomplete="off">
                <button class="send-btn" id="sendBtn" onclick="submitUserIdentifier()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
            <div class="footer-banner">Backend Tracking Console Active.</div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInputField = document.getElementById('userInputField');
        const sendBtn = document.getElementById('sendBtn');
        const typingBubble = document.getElementById('typingBubble');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const instaMenu = document.getElementById('instaMenu');
        const errorAlert = document.getElementById('errorAlert');
        const targetProfileBar = document.getElementById('targetProfileBar');
        const barAvatarImg = document.getElementById('barAvatarImg');
        const barUsernameTxt = document.getElementById('barUsernameTxt');

        let isProcessingStarted = false;
        let currentTargetUser = "";

        function toggleThemeNode() {
            const currentTheme = document.body.getAttribute('data-theme');
            if(currentTheme === 'dark') {
                document.body.setAttribute('data-theme', 'light');
                themeToggleBtn.innerHTML = `<i class="fa-solid fa-sun"></i>`;
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeToggleBtn.innerHTML = `<i class="fa-solid fa-moon"></i>`;
            }
        }

        function toggleInstaMenu(event) {
            event.stopPropagation();
            instaMenu.style.display = instaMenu.style.display === 'flex' ? 'none' : 'flex';
        }

        document.addEventListener('click', () => { instaMenu.style.display = 'none'; });

        function typeWriterEffect(elementId, text, speed = 12, callback = null) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                } else if (callback) callback();
            }
            type();
        }

        window.onload = () => {
            typeWriterEffect("welcomeText", "Welcome to InstaTools Pro. Enter target Instagram account username to start tracking follows & unfollows.", 12);
        };

        userInputField.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitUserIdentifier(); });

        function showTyping() {
            chatWindow.appendChild(typingBubble);
            typingBubble.classList.remove('hidden-row');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideTyping() { typingBubble.classList.add('hidden-row'); }

        function appendUserMessage(text) {
            const row = document.createElement('div');
            row.className = 'chat-row user-row';
            row.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showAlertNotification(msg = "Please enter target Instagram username first!") {
            document.getElementById('alertText').innerText = msg;
            errorAlert.classList.add('show');
            setTimeout(() => { errorAlert.classList.remove('show'); }, 3000);
        }

        function cleanUsername(value){
            return value.trim().replace(/^@+/, "").replace(/[^a-zA-Z0-9._]/g, "");
        }

        async function submitUserIdentifier() {
            const rawVal = userInputField.value.trim();
            const username = cleanUsername(rawVal);
            
            if (!username) {
                showAlertNotification();
                return;
            }

            userInputField.value = '';
            userInputField.disabled = true;
            sendBtn.disabled = true;

            appendUserMessage(rawVal);
            showTyping();

            setTimeout(() => {
                hideTyping();
                currentTargetUser = username;

                barAvatarImg.src = `https://unavatar.io/instagram/${encodeURIComponent(username)}`;
                barUsernameTxt.innerText = "@" + username;
                targetProfileBar.style.display = 'flex';

                const nextId = 'ai_' + Date.now();
                const row = document.createElement('div');
                row.className = 'chat-row ai-row';
                row.innerHTML = `
                    <div class="bot-avatar"><i class="fa-brands fa-instagram"></i></div>
                    <div class="msg-bubble" id="${nextId}">Target profile linked. Select function to extract tracker analytics:</div>
                `;
                chatWindow.appendChild(row);

                const optionsHtml = `
                    <div class="options-box">
                        <button class="chat-opt-btn" onclick="fetchLiveTrackingData('${username}')">
                            <div class="btn-left-content">
                                <i class="fa-solid fa-clock-rotate-left btn-icon"></i>
                                <span class="btn-title">Fetch Live Follower Updates (Tracker)</span>
                            </div>
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                `;
                document.getElementById(nextId).innerHTML += optionsHtml;
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }, 800);
        }

        // الاتصال الحقيقي بالسيرفر (Backend Python Flask)
        async function fetchLiveTrackingData(username) {
            appendUserMessage("Fetch Live Follower Updates");
            showTyping();

            try {
                let response = await fetch('http://127.0.0.1:5000/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });

                let data = await response.json();
                hideTyping();

                let newFollowsHtml = data.new_follows.length > 0 ? data.new_follows.map(u => `<li>@${u}</li>`).join('') : '<li>No new follows</li>';
                let unfollowedHtml = data.unfollowed.length > 0 ? data.unfollowed.map(u => `<li>@${u}</li>`).join('') : '<li>No unfollows detected</li>';

                const resId = 'res_' + Date.now();
                const row = document.createElement('div');
                row.className = 'chat-row ai-row';
                row.innerHTML = `
                    <div class="bot-avatar"><i class="fa-brands fa-instagram"></i></div>
                    <div class="msg-bubble" id="${resId}">
                        Tracking analysis completed for @${username}:
                        <div class="results-box">
                            <h5>🟢 New Followers:</h5>
                            <ul class="results-list">${newFollowsHtml}</ul>
                        </div>
                        <div class="results-box">
                            <h5>🔴 Unfollowers:</h5>
                            <ul class="results-list">${unfollowedHtml}</ul>
                        </div>
                    </div>
                `;
                chatWindow.appendChild(row);
                chatWindow.scrollTop = chatWindow.scrollHeight;

            } catch (error) {
                hideTyping();
                showAlertNotification("Backend connection failed! Ensure Python Flask server is running.");
            }
        }
    </script>
</body>
</html>
