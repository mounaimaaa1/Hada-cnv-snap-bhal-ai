<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnapTools</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --snap-yellow: #FFFC00;
            --snap-black: #000000;
            --bg-chat: #09090b;
            --bg-workspace: #020202;
            --bg-bubble-user: #1c1c1e;
            --border-color: #27272a;
            --text-main: #fafafa;
            --text-muted: #71717a;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --chat-btn-bg: #0c0c0e;
            --chat-btn-border: #1e1e22;
            --menu-bg: rgba(9, 9, 11, 0.95);
            --alert-bg: rgba(20, 20, 25, 0.85);
            --alert-border: rgba(255, 68, 68, 0.4);
        }

        [data-theme="light"] {
            --bg-chat: #f4f4f5;
            --bg-workspace: #e4e4e7;
            --bg-bubble-user: #e4e4e7;
            --border-color: #d4d4d8;
            --text-main: #09090b;
            --text-muted: #71717a;
            --chat-btn-bg: #ffffff;
            --chat-btn-border: #e4e4e7;
            --menu-bg: rgba(244, 244, 245, 0.95);
            --alert-bg: rgba(255, 255, 255, 0.9);
            --alert-border: rgba(255, 68, 68, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-workspace);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-chat);
            background-image: 
                radial-gradient(var(--border-color) 1px, transparent 0),
                linear-gradient(to right, rgba(255,252,0,0.01) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,252,0,0.01) 1px, transparent 1px);
            background-size: 24px 24px, 40px 40px, 40px 40px;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .chat-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-chat);
            z-index: 99;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
            padding-top: calc(16px + env(safe-area-inset-top));
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-bars-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-brand {
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }
        .ai-brand .part-snap {
            color: var(--snap-yellow);
        }
        .ai-brand .part-tools {
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-btn {
            background: var(--chat-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 16px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .snap-dropdown-menu {
            position: absolute;
            top: calc(68px + env(safe-area-inset-top));
            left: 16px;
            width: 220px;
            background: var(--menu-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            animation: fadeInMenu 0.2s ease-out;
        }

        @keyframes fadeInMenu {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            padding: 14px 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover, .menu-item:active { background: var(--bg-bubble-user); }
        .menu-item i { color: var(--snap-yellow); width: 16px; text-align: center; font-size: 14px; }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 5;
            -webkit-overflow-scrolling: touch;
        }

        .chat-row {
            display: flex;
            gap: 14px;
            max-width: 100%;
        }

        .chat-row.user-row { 
            flex-direction: row-reverse; 
        }

        .bot-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--snap-yellow);
            color: #000;
            font-weight: 800;
            font-size: 14px;
        }

        .bot-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg-bubble {
            font-size: 15px;
            line-height: 1.5;
            max-width: 88%;
            color: var(--text-main);
            padding-top: 6px;
        }

        .user-row .msg-bubble {
            background: var(--bg-bubble-user);
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 75%;
            font-weight: 500;
        }

        [data-theme="dark"] .user-row .msg-bubble {
            background: #2c2c2e;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 8px 0;
        }
        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Snapchat Mockup Card Style */
        .snap-mockup-card {
            background: #ffffff;
            color: #000000;
            border: 4px solid #FFFC00;
            border-radius: 28px;
            padding: 18px;
            margin-top: 14px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .mockup-top-icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #eee;
            font-size: 11px;
            color: #555;
            font-weight: 600;
        }
        .mockup-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .mockup-icon-item i {
            font-size: 16px;
            color: #222;
        }

        .mockup-profile-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
        }
        .mockup-avatar-img {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ddd;
        }
        .mockup-user-meta .m-name {
            font-size: 18px;
            font-weight: 800;
            color: #000;
        }
        .mockup-user-meta .m-handle {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        .mockup-user-meta .m-date {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .mockup-tabs {
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #eee;
            margin-top: 4px;
            font-size: 14px;
            font-weight: 700;
        }
        .mockup-tab-item {
            padding: 8px 0;
            color: #888;
            position: relative;
        }
        .mockup-tab-item.active {
            color: #000;
        }
        .mockup-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #000;
        }

        .mockup-sort-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 4px;
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }
        .sort-badge {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 12px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mockup-grid-posts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 4px;
        }
        .mockup-post-thumb {
            height: 110px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: #222;
        }
        .mockup-post-thumb i {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #fff;
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            padding: 4px;
            border-radius: 50%;
        }

        .options-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
            width: 100%;
        }

        .chat-opt-btn {
            background: var(--chat-btn-bg);
            border: 1px solid var(--chat-btn-border);
            color: var(--text-main);
            padding: 18px 16px;
            border-radius: 18px;
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s, transform 0.1s ease;
            width: 100%;
        }
        .chat-opt-btn:active { transform: scale(0.99); background: #16161a; }
        
        .btn-left-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .chat-opt-btn i.btn-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
            color: #FFFC00;
        }

        .chat-opt-btn i.fa-chevron-right { 
            font-size: 13px; 
            color: #71717a; 
        }

        .media-preview-container {
            border: 1px solid var(--border-color);
            background: var(--chat-btn-bg);
            border-radius: 16px;
            margin-top: 16px;
            overflow: hidden;
            max-width: 100%;
        }

        .media-header-label {
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .media-frame { 
            position: relative; 
            height: 180px; 
            background: #111; 
            background-size: cover;
            background-position: center;
        }
        
        .media-blur-overlay { 
            position: absolute; 
            inset: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            font-size: 13px; 
            font-weight: 600; 
            color: #e4e4e7; 
            letter-spacing: 0.5px; 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.2);
        }

        .progress-block { margin-top: 16px; width: 100%; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-main); margin-bottom: 8px; font-weight: 500; }
        .progress-bar-bg { width: 100%; background: var(--border-color); height: 4px; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--text-main); width: 0%; }

        .offer-verification-card {
            border: 1px dashed var(--text-muted);
            background: transparent;
            border-radius: 20px;
            padding: 32px 20px;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            width: 100%;
        }

        .offer-verification-card h4 { font-size: 19px; font-weight: 700; color: var(--text-main); }
        .offer-verification-card p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
        .verification-icon { color: var(--snap-black); background: var(--snap-yellow); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }

        .chat-input-area { 
            padding: 12px 16px calc(24px + env(safe-area-inset-bottom)) 16px;
            background: var(--bg-chat);
            z-index: 10;
            transition: background-color 0.3s;
        }
        
        .input-box-container {
            background: var(--chat-btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 6px 8px 6px 20px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .gpt-input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 15px; flex-grow: 1; padding: 10px 0; }
        .gpt-input::placeholder { color: var(--text-muted); }
        
        .send-btn {
            width: 40px;
            height: 40px;
            background: var(--text-main);
            color: var(--bg-chat);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .footer-banner {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 14px;
            font-weight: 400;
        }

        .hidden-row { display: none !important; }

        .custom-alert {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: var(--alert-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #ff4444;
            border: 1px solid var(--alert-border);
            padding: 14px 22px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            pointer-events: none;
        }
        .custom-alert.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .custom-alert i {
            font-size: 16px;
            animation: pulseAlert 1.5s infinite;
        }
        .custom-alert span {
            color: var(--text-main);
        }
        @keyframes pulseAlert {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="custom-alert" id="errorAlert">
        <i class="fa-solid fa-circle-exclamation"></i> <span>Please enter target Snapchat username first!</span>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <button class="menu-bars-btn" onclick="toggleSnapMenu(event)">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="brand-wrapper">
                    <span class="ai-brand">
                        <span class="part-snap">Snap</span><span class="part-tools">Tools</span>
                    </span>
                </div>
            </div>
            <div class="header-actions">
                <button class="theme-btn" id="themeToggleBtn" onclick="toggleThemeNode()">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>

        <div class="snap-dropdown-menu" id="snapMenu">
            <a href="https://snapchat.com/privacy" target="_blank" class="menu-item">
                <i class="fa-solid fa-user-shield"></i> Privacy Policy
            </a>
            <a href="https://snapchat.com/community" target="_blank" class="menu-item">
                <i class="fa-solid fa-scale-balanced"></i> Community Rules
            </a>
            <a href="https://support.snapchat.com" target="_blank" class="menu-item">
                <i class="fa-solid fa-circle-question"></i> Snapchat Support
            </a>
        </div>

        <div class="chat-history" id="chatWindow">
            <div class="chat-row ai-row" id="welcomeMsg">
                <div class="bot-avatar">ST</div>
                <div class="msg-bubble" id="welcomeText"></div>
            </div>

            <div class="chat-row ai-row hidden-row" id="typingBubble">
                <div class="bot-avatar">ST</div>
                <div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-box-container">
                <input type="text" class="gpt-input" id="userInputField" placeholder="Enter target Snapchat username..." autocomplete="off">
                <button class="send-btn" id="sendBtn" onclick="submitUserIdentifier()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
            <div class="footer-banner">End-to-End Encrypted Console. Anonymous Access Panel 2026.</div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInputField = document.getElementById('userInputField');
        const sendBtn = document.getElementById('sendBtn');
        const typingBubble = document.getElementById('typingBubble');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const snapMenu = document.getElementById('snapMenu');
        const errorAlert = document.getElementById('errorAlert');

        let isProcessingStarted = false;
        let currentTargetUser = "";
        let alertTimeout = null;

        // Dynamic streaming background images mapped per option name
        const optionImages = {
            'Snapchat Snaping': 'https://images.unsplash.com/photo-1611605698335-8b1569810432?w=500&auto=format&fit=crop&q=60',
            'Snap Camera': 'https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=500&auto=format&fit=crop&q=60',
            'View Friends List': 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500&auto=format&fit=crop&q=60',
            'Private Folders': 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500&auto=format&fit=crop&q=60',
            'Chat History': 'https://images.unsplash.com/photo-1577563908411-5077b6dc7624?w=500&auto=format&fit=crop&q=60',
            'Live Location Map': 'https://images.unsplash.com/photo-1524661135-423995f22d0b?w=500&auto=format&fit=crop&q=60',
            'Recent Activity': 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=500&auto=format&fit=crop&q=60'
        };

        document.body.setAttribute('data-theme', 'dark');
        
        function toggleThemeNode() {
            const currentTheme = document.body.getAttribute('data-theme');
            if(currentTheme === 'dark') {
                document.body.setAttribute('data-theme', 'light');
                themeToggleBtn.innerHTML = `<i class="fa-solid fa-sun"></i>`;
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeToggleBtn.innerHTML = `<i class="fa-solid fa-moon"></i>`;
            }
        }

        function toggleSnapMenu(event) {
            event.stopPropagation();
            if (snapMenu.style.display === 'flex') {
                snapMenu.style.display = 'none';
            } else {
                snapMenu.style.display = 'flex';
            }
        }

        document.addEventListener('click', () => {
            snapMenu.style.display = 'none';
        });

        function typeWriterEffect(elementId, text, speed = 12, callback = null) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        window.onload = () => {
            const explanation = "Welcome to SnapTools Pro. Enter the username of the target Snapchat account you want to monitor and view below.";
            typeWriterEffect("welcomeText", explanation, 12);
        };

        userInputField.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') submitUserIdentifier(); 
        });

        function showTyping() {
            chatWindow.appendChild(typingBubble);
            typingBubble.classList.remove('hidden-row');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideTyping() { typingBubble.classList.add('hidden-row'); }

        function appendUserMessage(text) {
            const row = document.createElement('div');
            row.className = 'chat-row user-row';
            row.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showAlertNotification() {
            if(alertTimeout) clearTimeout(alertTimeout);
            
            errorAlert.classList.add('show');
            alertTimeout = setTimeout(() => {
                errorAlert.classList.remove('show');
            }, 3000);
        }

        function formatFullName(username) {
            return username.replace(/[\.\_\-]/g, ' ')
                           .split(' ')
                           .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                           .join(' ');
        }

        function submitUserIdentifier() {
            const val = userInputField.value.trim();
            
            if (val === '') {
                showAlertNotification();
                return;
            }

            if(isProcessingStarted) return; 
            isProcessingStarted = true;
            currentTargetUser = val;

            userInputField.value = '';
            userInputField.disabled = true;
            sendBtn.disabled = true;

            appendUserMessage(val);

            setTimeout(() => {
                showTyping();
                
                setTimeout(() => {
                    hideTyping();
                    const nextId = 'ai_' + Date.now();
                    const row = document.createElement('div');
                    row.className = 'chat-row ai-row';
                    row.innerHTML = `
                        <div class="bot-avatar">ST</div>
                        <div class="msg-bubble" id="${nextId}"></div>
                    `;
                    chatWindow.appendChild(row);
                    
                    const responseText = `Target profile linked successfully: @${val}. Select the secure data layer you want to extract from this user dashboard:`;
                    
                    typeWriterEffect(nextId, responseText, 10, () => {
                        const fullName = formatFullName(val);
                        
                        // Dynamic seed-based images changing per username (API Mock)
                        const avatarUrl = `https://picsum.photos/seed/${val}_avatar/300/300`;
                        const gridThumb1 = `https://picsum.photos/seed/${val}_grid1/300/400`;
                        const gridThumb2 = `https://picsum.photos/seed/${val}_grid2/300/400`;
                        const gridThumb3 = `https://picsum.photos/seed/${val}_grid3/300/400`;

                        const profileCardHtml = `
                            <div class="snap-mockup-card">
                                <div class="mockup-top-icons">
                                    <div class="mockup-icon-item"><i class="fa-solid fa-book-open"></i> Stories</div>
                                    <div class="mockup-icon-item"><i class="fa-solid fa-play"></i> Spotlight</div>
                                    <div class="mockup-icon-item"><i class="fa-solid fa-comment"></i> Chat</div>
                                    <div class="mockup-icon-item"><i class="fa-solid fa-camera"></i> Lenses</div>
                                    <div class="mockup-icon-item"><i class="fa-solid fa-bolt"></i> Snapchat+</div>
                                    <div class="mockup-icon-item"><i class="fa-solid fa-download"></i> Download</div>
                                </div>
                                <div class="mockup-profile-header">
                                    <img src="${avatarUrl}" alt="Avatar" class="mockup-avatar-img">
                                    <div class="mockup-user-meta">
                                        <div class="m-name">${fullName}</div>
                                        <div class="m-handle">@${val}</div>
                                        <div class="m-date">Last updated 7/29/2026</div>
                                    </div>
                                </div>
                                <div class="mockup-tabs">
                                    <div class="mockup-tab-item active">All</div>
                                    <div class="mockup-tab-item">Spotlight</div>
                                </div>
                                <div class="mockup-sort-row">
                                    <span>Sort by:</span>
                                    <div class="sort-badge">Recent <i class="fa-solid fa-chevron-down" style="font-size:9px;"></i></div>
                                </div>
                                <div class="mockup-grid-posts">
                                    <div class="mockup-post-thumb" style="background-image: url('${gridThumb1}');"><i class="fa-solid fa-play"></i></div>
                                    <div class="mockup-post-thumb" style="background-image: url('${gridThumb2}');"><i class="fa-solid fa-play"></i></div>
                                    <div class="mockup-post-thumb" style="background-image: url('${gridThumb3}');"><i class="fa-solid fa-play"></i></div>
                                </div>
                            </div>
                        `;

                        const optionsHtml = `
                            <div class="options-box">
                                <button class="chat-opt-btn" onclick="checkUsernameAndSelect('Snapchat Snaping', '${val}')">
                                    <div class="btn-left-content">
                                        <i class="fa-solid fa-bolt btn-icon"></i>
                                        <span class="btn-title">Snapchat Snaping</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <button class="chat-opt-btn" onclick="checkUsernameAndSelect('Snap Camera', '${val}')">
                                    <div class="btn-left-content">
                                        <i class="fa-solid fa-camera btn-icon"></i>
                                        <span class="btn-title">Snap Camera</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <button class="chat-opt-btn" onclick="checkUsernameAndSelect('View Friends List', '${val}')">
                                    <div class="btn-left-content">
                                        <i class="fa-solid fa-user-group btn-icon"></i>
                                        <span class="btn-title">View Friends List</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <button class="chat-opt-btn" onclick="checkUsernameAndSelect('Private Folders', '${val}')">
                                    <div class="btn-left-content">
                                        <i class="fa-solid fa-eye-slash btn-icon"></i>
                                        <span class="btn-title">Private Folders</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <button class="chat-opt-btn" onclick="checkUsernameAndSelect('Chat History', '${val}')">
                                    <div class="btn-left-content">
                                        <i class="fa-solid fa-comment btn-icon"></i>
                                        <span class="btn-title">Chat History</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <button class="chat-opt-btn" onclick="checkUsernameAndSelect('Live Location Map', '${val}')">
                                    <div class="btn-left-content">
                                        <i class="fa-solid fa-map-location-dot btn-icon"></i>
                                        <span class="btn-title">Live Location Map</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                                <button class="chat-opt-btn" onclick="checkUsernameAndSelect('Recent Activity', '${val}')">
                                    <div class="btn-left-content">
                                        <i class="fa-solid fa-chart-line btn-icon"></i>
                                        <span class="btn-title">Recent Activity</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                            </div>
                        `;
                        document.getElementById(nextId).innerHTML += profileCardHtml + optionsHtml;
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                    });
                }, 1000);
            }, 800);
        }

        function checkUsernameAndSelect(nodeName, username) {
            if (!currentTargetUser || currentTargetUser === "") {
                showAlertNotification();
                return;
            }
            selectModuleNode(nodeName, username);
        }

        function selectModuleNode(nodeName, username) {
            const btns = document.querySelectorAll('.chat-opt-btn');
            btns.forEach(b => b.removeAttribute('onclick'));

            appendUserMessage(nodeName);

            setTimeout(() => {
                showTyping();

                setTimeout(() => {
                    hideTyping();
                    
                    const barId = 'bar_' + Date.now();
                    const txtId = 'txt_' + Date.now();
                    const frameId = 'frame_' + Date.now();

                    const nextId = 'ai_load_' + Date.now();
                    const row = document.createElement('div');
                    row.className = 'chat-row ai-row';
                    row.innerHTML = `
                        <div class="bot-avatar">ST</div>
                        <div class="msg-bubble" id="${nextId}"></div>
                    `;
                    chatWindow.appendChild(row);

                    const loadingIntro = `Fetching cloud databank for ${nodeName}. Establishing anonymous stream:`;
                    
                    typeWriterEffect(nextId, loadingIntro, 10, () => {
                        const bgImage = optionImages[nodeName] || "";
                        
                        const loadingHtml = `
                            <div class="progress-block">
                                <div class="progress-labels">
                                    <span>Downloading remote assets...</span>
                                    <span id="${txtId}" style="font-weight:600;">0%</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" id="${barId}"></div>
                                </div>
                            </div>
                            <div class="media-preview-container">
                                <div class="media-header-label"><i class="fa-regular fa-eye"></i> Live Stream Window</div>
                                <div class="media-frame" id="${frameId}" style="background-image: url('${bgImage}');">
                                    <div class="media-blur-overlay">
                                        <i class="fa-solid fa-lock" style="font-size:18px; margin-bottom: 4px; color: var(--snap-yellow);"></i>
                                        <span>ENCRYPTED_PREVIEW.RAW</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        document.getElementById(nextId).innerHTML += loadingHtml;
                        animateProgressBarNode(barId, txtId);
                    });

                }, 800);
            }, 600);
        }

        function animateProgressBarNode(barId, txtId) {
            let percentage = 0;
            const fill = document.getElementById(barId);
            const text = document.getElementById(txtId);

            const loop = setInterval(() => {
                percentage += 2;
                if(fill) fill.style.width = percentage + '%';
                if(text) text.innerText = percentage + '%';

                if(percentage >= 100) {
                    clearInterval(loop);
                    setTimeout(() => {
                        showTyping();
                        setTimeout(() => {
                            hideTyping();
                            
                            const finalCardId = 'final_' + Date.now();
                            const row = document.createElement('div');
                            row.className = 'chat-row ai-row';
                            row.innerHTML = `
                                <div class="bot-avatar">ST</div>
                                <div class="msg-bubble" id="${finalCardId}"></div>
                            `;
                            chatWindow.appendChild(row);

                            const finalOfferHtml = `
                                <div class="offer-verification-card" style="border-color: #FFFC00;">
                                    <div class="verification-icon"><i class="fa-solid fa-unlock"></i></div>
                                    <h4>Continue to Unlock</h4>
                                    <p>Complete the verification step to access this secure data stream.</p>
                                    <a href="https://appsave.online/cl/i/9vm81v" target="_blank" style="display:inline-block; background:#FFFC00; color:#000; padding:14px 28px; border-radius:30px; font-weight:700; text-decoration:none; font-size:15px; margin-top:8px;">
                                        <i class="fa-solid fa-arrow-right"></i> Verify & Access
                                    </a>
                                </div>
                            `;
                            document.getElementById(finalCardId).innerHTML = finalOfferHtml;
                            chatWindow.scrollTop = chatWindow.scrollHeight;
                        }, 1000);
                    }, 400);
                }
            }, 35);
        }
    </script>
</body>
</html>
